<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="box" style="width:640px;height:480px"></div>
<script type="module">
  const post = (ok, msg) => {
    try {
      fetch('/__probe', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ diag: 'sky-image', ok, msg: String(msg).slice(0, 800) }) });
    } catch (e) { /* ignore */ }
  };
  window.addEventListener('error', e => post(false, 'window error: ' + e.message));
  try {
    const THREE = await import('three');
    // 直接用 TextureLoader 验证图片真能加载（这才是天幕能不能显示的关键）
    const loader = new THREE.TextureLoader();
    const files = ['hell_throne.jpg', 'sakura_ancient.jpg', 'star_nebula.jpg', 'sea_pinkblue.jpg'];
    const results = [];
    for (const f of files) {
      try {
        const tex = await loader.loadAsync('./assets/sky/' + f);
        results.push(f + '=' + tex.image.width + 'x' + tex.image.height);
      } catch (e) {
        results.push(f + '=FAILED(' + (e && e.message) + ')');
      }
    }
    const allOk = results.every(r => r.indexOf('FAILED') < 0);
    post(allOk, results.join(' | '));
  } catch (err) {
    post(false, (err && (err.stack || err.message)) || err);
  }
</script>
</body>
</html>
